<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700;800&display=swap" rel="stylesheet">


  <style>
    /* Gallery-only page: removes the profile sidebar and gives the gallery the full page width. */
    body {
      background:
        radial-gradient(circle at 16% 12%, rgba(85, 167, 255, 0.20), transparent 30%),
        radial-gradient(circle at 90% 35%, rgba(14, 165, 164, 0.14), transparent 30%),
        linear-gradient(135deg, #f8fafc, #eaf1f8);
      color: #0f172a;
    }

    .site-header {
      background: linear-gradient(135deg, #071225, #0b1b32);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: none;
    }
    
    .nav-links a {
      color: #b6c2d4; 
    }

    .nav-links a:hover {
      color: #ffffff;
    }
    
    .gallery-item {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.14);
    }
    
    .gallery-only-layout {
      width: min(1320px, calc(100% - 64px));
      margin: 0 auto;
      padding: 72px 0 80px;
    }

    .gallery-panel {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
    }

    .gallery-hero {
      margin-bottom: 36px;
    }

    .gallery-hero .section-heading {
      justify-content: center;
      text-align: center;
      margin-bottom: 38px;
    }

    .gallery-hero .section-heading h2 {
      font-size: clamp(3.2rem, 6vw, 5.2rem);
      line-height: 1;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 34px;
    }

    .gallery-item {
      position: relative;
      margin: 0;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(130, 181, 255, 0.24);
      box-shadow: 0 24px 58px rgba(0, 0, 0, 0.30);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.025);
    }

    .gallery-item figcaption {
      padding: 18px 24px;
      color: #ffffff;
      background: linear-gradient(90deg, rgba(8, 36, 82, 0.96), rgba(26, 94, 178, 0.88));
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
    }

    .gallery-item figcaption ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .gallery-item figcaption li {
      margin: 0;
      font-size: clamp(0.95rem, 1.15vw, 1.08rem);
      line-height: 1.45;
      font-weight: 600;
    }

    .gallery-item figcaption strong {
      color: #dbeafe;
      font-weight: 800;
    }

    @media (max-width: 920px) {
      .gallery-only-layout {
        width: min(100% - 32px, 760px);
        padding: 52px 0 64px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 26px;
      }

      .gallery-item img {
        height: 340px;
      }
    }

    @media (max-width: 540px) {
      .gallery-only-layout {
        width: calc(100% - 24px);
      }

      .gallery-hero .section-heading {
        justify-content: flex-start;
        text-align: left;
      }

      .gallery-item img {
        height: 270px;
      }

      .gallery-item figcaption {
        position: relative;
        background: rgba(8, 36, 82, 0.98);
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo image-logo" href="index.html" aria-label="Omar Ahmed Keshk homepage">

      </a>

      <button class="menu-toggle" aria-label="Open navigation">☰</button>

      <div class="nav-links">

        <a href="outputs.html">Research Outputs</a>
        <a href="history.html">History of Alexandria</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>

    </nav>

  <main class="gallery-only-layout">
    <section class="content-panel gallery-panel">
      <section class="section intro-section gallery-hero">
        <div class="section-heading"><span class="icon">𓇼</span><h2>Gallery</h2></div>
        <div class="gallery-grid">
          <figure class="gallery-item">
            <img src="assets/gallery/jinr.jpg" alt="Research internship (START programme) at JINR in Dubna, Russia." onerror="this.style.display='none'">

          </figure>

          </figure>
          <figure class="gallery-item">

          </figure>
          <figure class="gallery-item">
            <img src="assets/gallery/michigan-2024.jpg" alt="Attending the University of Michigan Nuclear Engineering Summer School." onerror="this.style.display='none'">
            <figcaption><ul><li><strong>Summer 2024:</strong> Attending the University of Michigan Nuclear Engineering Summer School.</li></ul></figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/gallery/scholarship-2024.jpg" alt="Receiving the AUC/UCCD Engineering Program Scholarship." onerror="this.style.display='none'">

          </figure>
          <figure class="gallery-item">
            <img src="assets/gallery/ugrf-2023.jpg" alt="Presenting a poster at the 16th UGRF and the 4th Egyptian Junior Researcher Competition, Nile University." onerror="this.style.display='none'">
            <figcaption><ul><li><strong>August 2023:</strong> Presenting a poster at the 16th UGRF and the 4th Egyptian Junior Researcher Competition, Nile University.</li></ul></figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/gallery/planetarium.jpg" alt="Volunteering at the Planetarium Science Center, Bibliotheca Alexandrina." onerror="this.style.display='none'">
            <figcaption><ul><li><strong>2017 to 2019:</strong> Volunteering at the Planetarium Science Center, Bibliotheca Alexandrina.</li></ul></figcaption>
          </figure>
        </div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Omar Ahmed Keshk.</p>
  </footer>
